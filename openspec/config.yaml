schema: spec-driven

context: |
  Project: vyloop — Loyalty/Engagement SaaS for LatAm SMBs.
  Stack: Next.js + TypeScript (frontend), Cloudflare Workers + Hono (backend/api),
    PostgreSQL + ClickHouse (data), Kafka/Queues (event bus).
  Architecture: Event-first, DDD bounded contexts (Identity, Customer, Growth,
    Communication, Automation, Analytics, Compliance), microservices on Workers.
  Testing: Vitest, with lint, typecheck and format as the quality gates.
  Style: TypeScript, strict typing, Edge-first, multi-tenant with RLS.

rules:
  proposal:
    - Reference the FidelidApp analysis (analisis.md) for competitive positioning
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Reference event-driven patterns from atlas-docs/07-Architecture.md
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: 'pnpm -r test'
  verify:
    test_command: 'pnpm -r test'
    build_command: 'pnpm -r typecheck'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  note: 'The project has a test framework. Strict TDD is not enabled as a policy, but the commands below are what CI runs, and a change is not done until they pass.'
  runner: vitest
  layers:
    unit: { available: true, tool: vitest }
    integration: { available: true, tool: vitest }
    e2e: { available: false, tool: null }
  coverage: { available: false, command: null }
  quality:
    linter: { available: true, command: 'pnpm -r lint' }
    type_checker: { available: true, command: 'pnpm -r typecheck' }
    formatter: { available: true, command: 'pnpm format' }
