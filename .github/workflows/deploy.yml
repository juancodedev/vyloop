name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Type check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  deploy-workers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            dir: workers/identity
          - service: customer
            dir: workers/customer
          - service: growth
            dir: workers/growth
          - service: analytics
            dir: workers/analytics
          - service: automation
            dir: workers/automation
          - service: communication
            dir: workers/communication
          - service: compliance
            dir: workers/compliance
          - service: gateway
            dir: apps/gateway

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.service }} worker
        run: |
          ARGS=""
          if [ "${{ matrix.service }}" = "identity" ]; then
            ARGS="$ARGS --var JWT_SECRET:${{ secrets.JWT_SECRET }}"
            ARGS="$ARGS --var DATABASE_URL:${{ secrets.DATABASE_URL }}"
          fi
          if [ "${{ matrix.service }}" = "gateway" ]; then
            ARGS="$ARGS --var JWT_SECRET:${{ secrets.JWT_SECRET }}"
          fi
          npx --yes wrangler deploy $ARGS
        working-directory: ${{ matrix.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-dashboard:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with @cloudflare/next-on-pages
        run: pnpm pages:build
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://gateway.cl-jmunoz.workers.dev' }}

      - name: Deploy dashboard to Cloudflare Pages
        run: >-
          npx --yes wrangler pages deploy
          .vercel/output/static
          --project-name=vyloop-dashboard
          --branch main
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-customer-web:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with @cloudflare/next-on-pages
        run: npx --yes @cloudflare/next-on-pages
        working-directory: apps/customer-web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://gateway.cl-jmunoz.workers.dev' }}

      - name: Deploy customer-web to Cloudflare Pages
        run: >-
          npx --yes wrangler pages deploy
          .vercel/output/static
          --project-name=vyloop-customer-web
          --branch main
        working-directory: apps/customer-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
