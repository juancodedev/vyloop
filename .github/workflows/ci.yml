name: CI

# Only on pull requests.
#
# This workflow used to run on `push` to `main` as well, which meant the same
# code was validated twice for every merge: once by the `pull_request` event,
# which runs against the merge result, and again by the `push` event.
#
# The `push` run was the third validation of the same commit, not the first —
# `deploy.yml` has its own `quality` job that runs before anything is
# published, and that one is the gate that protects production. Dropping this
# trigger leaves two validations where there were three, and the one that
# guards a release is the one that stays.
#
# A repository on the free plan with a private repository is billed per runner
# minute, and the quota is finite. Runner minutes are spent on work that has
# to happen, not on the same work happening again.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A registry outage fails this step on purpose. The alternative is a gate
      # that passes when it could not look, which is not a gate.
      - name: Dependency audit
        run: pnpm deps:audit

      - name: Lint
        run: pnpm -r lint

      - name: Type check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # `pnpm -r test` walks the workspace packages, which skips this repo's own
      # root — so the operational scripts under `scripts/` had tests that nothing
      # ever ran. A test that cannot fail is worse than no test: it reads as
      # coverage in review and is not. `wallet:readiness` guards the public
      # program page that Google opens while reviewing a class, and a 404 there
      # rejects the class; that gate was only verifiable by hand.
      #
      # `--dir`, not a bare `scripts/`: the substring form also matches
      # `packages/*/scripts/`, and those belong to packages that configure their
      # own globals — collecting them here fails on `beforeEach is not defined`.
      - name: Test operational scripts
        run: npx vitest run --dir scripts
